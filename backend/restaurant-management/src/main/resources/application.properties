spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
refresh.expiration=${REFRESH_EXPIRATION_MS:604800000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:true}
app.currency=${RESTAURANT_CURRENCY:USD}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.mode=${PAYPAL_MODE:SANDBOX}
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.secret-key=${PAYPAL_SECRET}
spring.flyway.placeholders.legacyCurrency=${LEGACY_PAYMENT_CURRENCY:UNSET}
